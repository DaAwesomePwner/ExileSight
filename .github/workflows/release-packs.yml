name: Release PoE1 data packs
on:
  workflow_dispatch:
    inputs:
      pack_version:
        description: 'Release version (tag: poe1-packs-<version>; manifests retain source SHA)'
        required: true
        type: string
      repoe_sha:
        description: 'Optional full 40-hex RePoE commit; blank uses tools/ExileSight.DataGen/repoe.json'
        required: false
        default: ''
        type: string
      dry_run:
        description: Build and validate artifacts without publishing a release
        type: boolean
        default: true
      prerelease:
        description: Mark the published release as a prerelease
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-packs-${{ inputs.pack_version }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.config.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Resolve and validate inputs
        id: config
        env:
          PACK_VERSION: ${{ inputs.pack_version }}
          REPOE_OVERRIDE: ${{ inputs.repoe_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          config = json.loads(Path('tools/ExileSight.DataGen/repoe.json').read_text())
          version = os.environ['PACK_VERSION']
          if not re.fullmatch(r'[A-Za-z0-9]+([._-][A-Za-z0-9]+)*', version) or version.endswith('.lock'):
              raise SystemExit('Invalid pack version: use alphanumeric groups separated by one dot, underscore or hyphen; no .lock suffix')
          sha = os.environ['REPOE_OVERRIDE'] or config['sourceSha']
          if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
              raise SystemExit('RePoE SHA must be a full 40-hex commit')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'REPOE_SHA={sha.lower()}\nPACK_TAG=poe1-packs-{version}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag=poe1-packs-{version}\n')
          PY
      - name: Test DataGen
        run: dotnet test tests/ExileSight.DataGen.Tests -c Release
      - name: Verify source commit belongs to upstream master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/repoe-fork/repoe-fork.github.io/compare/$REPOE_SHA...master" --jq '.status')
          case "$status" in
            ahead|identical) ;;
            *) echo "::error::RePoE SHA must be reachable from upstream master (compare status: $status)."; exit 1 ;;
          esac
      - name: Fetch pinned export and generate packs
        run: |
          mkdir -p export bundle/packs
          for file in base_items.json mods.json; do
            curl --proto '=https' --fail --silent --show-error \
              "https://raw.githubusercontent.com/repoe-fork/repoe-fork.github.io/$REPOE_SHA/data/$file" \
              --output "export/$file"
          done
          dotnet run --project tools/ExileSight.DataGen -c Release -- \
            poe1 --repoe-sha "$REPOE_SHA" --source-dir export --out bundle/packs
      - name: Verify manifests, provenance and exact content bytes
        run: |
          (cd bundle/packs && sha256sum --check --strict SHA256SUMS)
          python3 - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          root = Path('bundle/packs')
          sha = os.environ['REPOE_SHA']
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          inputs = {f'data/{p.name}': hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in Path('export').glob('*.json')}
          for kind in ('bases', 'mods'):
              name = f'poe1-{kind}'
              raw = (root / f'{name}.json').read_bytes()
              content = json.loads(raw)
              manifest = json.loads((root / f'{name}.manifest.json').read_bytes())
              cache = json.loads((root / f'{name}.pack.json').read_bytes())
              require(manifest['source'] == {
                  'repo': 'repoe-fork/repoe-fork.github.io', 'sha': sha, 'files': inputs}, 'Invalid provenance')
              require(manifest['contentSha256'] == hashlib.sha256(raw).hexdigest(), 'Content hash mismatch')
              for document in (manifest, content):
                  require(document['packId'] == f'poe1/{kind}' and document['game'] == 1
                          and document['schemaVersion'] == 2 and document['packVersion'] == sha,
                          'Pack identity/version mismatch')
              require(cache['manifest'] == manifest and base64.b64decode(cache['contentBytes'], validate=True) == raw,
                      'Invalid cache envelope')
              require(f'RePoE fork project (commit {sha})' in manifest['attribution']
                      and '© Grinding Gear Games' in manifest['attribution']
                      and "permission of the project owner" in manifest['attribution']
                      and "not affiliated with or endorsed by Grinding Gear Games" in manifest['attribution']
                      and "D-047" not in manifest['attribution'], 'Missing attribution')
              require(len(raw) <= 32 * 1024 * 1024, 'Content exceeds default PackLoader transport limit')
          notes = (f'PoE1 data packs: {os.environ["PACK_TAG"]}\n\n'
                   f'Source: RePoE fork https://github.com/repoe-fork/repoe-fork.github.io/tree/{sha}\n'
                   f'Source SHA: {sha}\n\n' + manifest['attribution'] + '\n\n'
                   "This product isn't affiliated with or endorsed by Grinding Gear Games in any way.\n"
                   'Manifests record per-input SHA-256, schema and source-SHA pack versions. '
                   'SHA256SUMS covers all six generated JSON assets. No game data is committed to git.\n')
          Path('bundle/RELEASE-NOTES.md').write_text(notes, encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: poe1-packs
          path: bundle/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    needs: build
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: poe1-packs
          path: bundle
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACK_TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          (cd bundle/packs && sha256sum --check --strict SHA256SUMS)
          if gh release view "$PACK_TAG" --json tagName >/dev/null 2>release-check.err; then
            echo "::error::A release or draft already exists for $PACK_TAG. Choose a new pack version."
            exit 1
          elif ! grep -qi 'release not found' release-check.err; then
            echo "::error::Could not check for an existing release; refusing to publish."
            cat release-check.err >&2
            exit 1
          fi
          options=()
          if [[ "$PRERELEASE" == 'true' ]]; then options+=(--prerelease); fi
          gh release create "$PACK_TAG" --target "$GITHUB_SHA" --draft --latest=false \
            --title "$PACK_TAG" --notes-file bundle/RELEASE-NOTES.md "${options[@]}"
          gh release upload "$PACK_TAG" bundle/packs/*.json bundle/packs/SHA256SUMS
          gh release edit "$PACK_TAG" --draft=false --latest=false
