name: Release app
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (stable: 1.0.0; beta: 1.0.0-beta.1)'
        required: true
        type: string
      channel:
        description: Update channel
        required: true
        type: choice
        options: [stable, beta]
        default: stable
      dry_run:
        description: Build and validate without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-app-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  reject-off-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject off-main dispatch
        run: |
          echo '::error::Release app must be dispatched from main. Select main and run again.'
          exit 1
  build:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      APP_VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Validate release version and channel
        shell: pwsh
        run: |
          $pattern = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z'
          if ($env:CHANNEL -eq 'beta') { $pattern = $pattern.Substring(0, $pattern.Length - 2) + '-beta\.(0|[1-9][0-9]*)\z' }
          if ($env:CHANNEL -notin @('stable', 'beta') -or $env:APP_VERSION -cnotmatch $pattern) {
            throw 'Use X.Y.Z for stable or X.Y.Z-beta.N for beta, without leading zeroes.'
          }
      - run: dotnet build ExileSight.slnx -c Release -warnaserror
      - run: dotnet test ExileSight.slnx -c Release --no-build
      - name: Generate and verify pinned packs
        shell: pwsh
        run: |
          $sha = (Get-Content tools/ExileSight.DataGen/repoe.json | ConvertFrom-Json).sourceSha
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid pinned SHA' }
          python tools/ExileSight.DataGen/fetch-inputs.py artifacts/export $sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tools/ExileSight.DataGen -c Release -- poe1 --repoe-sha $sha --source-dir artifacts/export --out artifacts/packs/poe1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ExileSight.DataGen/verify-packs.py artifacts/packs/poe1 artifacts/export $sha artifacts/fallback/packs/poe1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish installer input
        shell: pwsh
        run: |
          dotnet publish src/ExileSight.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false "-p:Version=$env:APP_VERSION" -o artifacts/velopack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item artifacts/fallback/packs artifacts/velopack/packs -Recurse -Force
      - name: Install pinned Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.161
      - name: Pack with optional signing
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ vars.SIGNING_TIMESTAMP_URL }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'ExileSight-signing.pfx'
          $certs = @()
          try {
            $sign = @()
            if ($env:CERT_BASE64 -and $env:CERT_PASSWORD) {
              if ($env:SIGNING_TIMESTAMP_URL -notmatch '\Ahttps?://[^\s"<>]+\z') {
                throw 'Signing requires release environment variable SIGNING_TIMESTAMP_URL (HTTP(S) RFC 3161 TSA URL).'
              }
              [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_BASE64))
              $password = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
              $certs = @(Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
              $leaf = @($certs | Where-Object HasPrivateKey)
              if ($leaf.Count -ne 1) { throw 'Expected exactly one signing private key' }
              # Store lookup keeps the password out of CLI arguments and Velopack logs.
              $sign = @('--signParams', "/s My /sha1 $($leaf[0].Thumbprint) /fd SHA256 /tr $env:SIGNING_TIMESTAMP_URL /td SHA256")
            } else {
              Write-Output '::warning::Signing secrets absent or incomplete; producing unsigned artifacts.'
            }
            vpk pack --packId ExileSight --packVersion $env:APP_VERSION --packDir artifacts/velopack --mainExe ExileSight.App.exe --packTitle ExileSight --channel $env:CHANNEL --outputDir Releases @sign
            if ($LASTEXITCODE -ne 0) { throw 'Velopack packaging failed' }
          } finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
            foreach ($cert in $certs) { Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey -Force -ErrorAction SilentlyContinue }
          }
      - name: Prepare feeds, attribution and size report
        shell: pwsh
        run: |
          # GitHub prerelease inclusion does not merge channel feeds. Advertise the
          # same stable package to beta clients without repacking or renaming it.
          if ($env:CHANNEL -eq 'stable') { Copy-Item Releases/releases.stable.json Releases/releases.beta.json }
          Copy-Item artifacts/packs/poe1/ATTRIBUTION.txt Releases/ATTRIBUTION.txt
          $rows = @('| Asset | Bytes | MiB |', '|---|---:|---:|')
          foreach ($file in Get-ChildItem Releases -File | Sort-Object Name) {
            $rows += "| $($file.Name) | $($file.Length) | $([math]::Round($file.Length / 1MB, 2)) |"
          }
          $rows | Set-Content Releases/ASSET-SIZES.md
          $rows >> $env:GITHUB_STEP_SUMMARY
          @("ExileSight v$env:APP_VERSION ($env:CHANNEL)", '', (Get-Content Releases/ATTRIBUTION.txt -Raw)) | Set-Content artifacts/RELEASE-NOTES.md
          $hashes = @(Get-ChildItem Releases -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          })
          # LF-only, no BOM: the publish job verifies this file on Linux.
          [IO.File]::WriteAllText((Join-Path $PWD 'Releases/SHA256SUMS'), ($hashes -join "`n") + "`n")
      - name: Clean decoded certificate on cancellation or failure
        if: always()
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'ExileSight-signing.pfx'
          if (Test-Path $certPath) { Remove-Item $certPath -Force }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ExileSight-release-${{ inputs.channel }}
          path: |
            Releases/
            artifacts/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14
  publish:
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    needs: build
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ExileSight-release-${{ inputs.channel }}
          path: bundle
      - name: Guard stable app release window
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEW_STABLE_APP: ${{ inputs.channel == 'stable' }}
        run: |
          set -euo pipefail
          # Preserve API order, exclude drafts invisible to the app, and reserve
          # one of the first ten public release slots for the incoming release.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/release-window.json"
          if ! jq -e --arg stable "$NEW_STABLE_APP" '
            add | map(select(.draft == false)) |
            (map(select(.prerelease == false and
              any(.assets[]?; .name == "releases.stable.json"))) | max_by(.published_at) | .id) as $latest |
            ($stable == "true" or ($latest != null and any(.[0:9][]; .id == $latest)))
            ' "$RUNNER_TEMP/release-window.json" > /dev/null; then
            echo '::error::Publish a stable app release first: this release would hide the newest stable app feed from the first ten releases.'
            exit 1
          fi
      - name: Publish verified app assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          cd bundle/Releases
          sha256sum --check --strict SHA256SUMS
          tag="v$APP_VERSION"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>tag-check.err; then
            echo '::error::Tag already exists. Choose a new version.'; exit 1
          elif ! grep -q 'HTTP 404' tag-check.err; then
            echo '::error::Could not check tag availability.'; exit 1
          fi
          rm tag-check.err
          options=()
          if [[ "$CHANNEL" == beta ]]; then options+=(--prerelease); fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft --latest=false \
            --title "$tag" --notes-file ../artifacts/RELEASE-NOTES.md "${options[@]}"
          gh release upload "$tag" ./*
          gh release edit "$tag" --draft=false --latest=false
